

name: build-ctrlblck-development
on:
    push:
        branches:
            - '**'
        tags-ignore:
            - '**'

jobs:
    build:
        # Playwright 1.58.2 can't install Chromium on Ubuntu 26.04 (ubuntu-latest).
        # Back to ubuntu-latest once Playwright is upgraded.
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@main
            - name: Enable pnpm via corepack
              run: corepack enable
            - name: Setup node
              uses: actions/setup-node@v5
              with:
                node-version: 24
            - name: Build extension
              run: |
                set -x
                export GIT_SHA=$(git rev-parse --short HEAD)
                pnpm install
                pnpm run build
            - name: Upload build
              uses: actions/upload-artifact@v6
              with:
                  name: ctrlblock-development-${{ github.sha }}
                  path: dist/
            # After the upload: the filter suite rebuilds dist/ with
            # --filter-test, which must not end up in the artifact.
            - name: Install Playwright Chromium
              run: pnpm exec playwright install --with-deps chromium
            - name: Run scriptlet tests
              run: pnpm test:scriptlets
            - name: Run filter tests
              run: pnpm test:filter
